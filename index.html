<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>おみ句じ ＆ 季寄せ</title>

    <!-- PWA / Android・iOS スタンドアロン（アプリ化）強力指定 -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="おみ句じ">
    <meta name="application-name" content="おみ句じ">
    <meta name="theme-color" content="#faf9f6">
    
    <!-- アプリアイコン指定 -->
    <link rel="icon" type="image/png" sizes="192x192" href="icon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="icon.png">
    <link rel="manifest" href="manifest.json">

    <!-- 🎨 デザインファイルを読み込み -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="loadingOverlay">おみ句じを振っています...</div>

    <!-- 🐾 おみ句じ猫ボタン -->
    <img id="fixedCatBtn" src="omikuji-cat.png" alt="おみ句じを引く" class="fixed-cat-trigger hidden" onclick="triggerInstantOmikuji()" title="おみ句じを引く">

    <!-- 2段構造のグローバルヘッダー領域 -->
    <div id="headerArea" class="global-header-area">
        <div class="header-row-top">
            <div id="globalBreadcrumb" class="breadcrumb" style="display: none;"></div>
        </div>
        <div class="header-row-bottom">
            <div id="roomMainTag" class="info-upper-tag"></div>
            <div id="infoTrigger" onclick="revealHiddenInfo()">ℹ</div>
        </div>
    </div>

    <!-- 🏡 トップメニュー -->
    <div id="topPage" class="layer-page">
        <!-- おみ句じ ブロック -->
        <div class="menu-block">
            <div class="sub-menu-group">
                <div class="vertical-link sub-link" onclick="openRoom('detarame', 'all', 'いっしょくた')">いっしょくた</div>
                <div class="vertical-link sub-link" onclick="navigateTo('haijinPage')">俳人</div>
                <div class="vertical-link sub-link" onclick="navigateTo('haikuPage')">季節</div>
            </div>
            <div class="vertical-link main-headline" style="cursor: default;">おみ句じ</div>
        </div>
        
        <!-- 季寄せ ブロック -->
        <div class="menu-block">
            <div class="vertical-link main-headline" onclick="navigateTo('saijikiPage')">季寄せ</div>
        </div>
    </div>

    <!-- おみ句じ：俳人 ページ -->
    <div id="haijinPage" class="layer-page">
        <div id="haijinList" class="horizontal-scroll-container"></div>
    </div>

    <!-- おみ句じ：季節 ページ -->
    <div id="haikuPage" class="layer-page">
        <div class="horizontal-scroll-container">
            <div class="vertical-link" onclick="openRoom('haiku_season', 'haru', '春の句')">春</div>
            <div class="vertical-link" onclick="openRoom('haiku_season', 'natsu', '夏の句')">夏</div>
            <div class="vertical-link" onclick="openRoom('haiku_season', 'aki', '秋の句')">秋</div>
            <div class="vertical-link" onclick="openRoom('haiku_season', 'huyu', '冬の句')">冬</div>
            <div class="vertical-link" onclick="openRoom('haiku_season', 'shinnen', '新年の句')">新年</div>
            <div class="vertical-link" onclick="openRoom('haiku_season', 'muki', '無季の句')">無季</div>
        </div>
    </div>

    <!-- 季寄せ：季節一覧 ページ -->
    <div id="saijikiPage" class="layer-page">
        <div class="fits-screen-container">
            <div class="vertical-link" onclick="showKigoList('haru', '春')">春</div>
            <div class="vertical-link" onclick="showKigoList('natsu', '夏')">夏</div>
            <div class="vertical-link" onclick="showKigoList('aki', '秋')">秋</div>
            <div class="vertical-link" onclick="showKigoList('huyu', '冬')">冬</div>
            <div class="vertical-link" onclick="showKigoList('shinnen', '新年')">新年</div>
            <div class="vertical-link" onclick="openRoom('kigo_muki', 'muki', '無季')">無季</div>
        </div>
    </div>

    <!-- 季寄せ：親季語一覧 ページ -->
    <div id="kigoListPage" class="layer-page">
        <div id="kigoList" class="horizontal-scroll-container"></div>
    </div>

    <!-- 一句一画面 スクリーン部屋 -->
    <div id="roomPage" class="layer-page">
        <button id="prevBtn" class="nav-arrow arrow-right" onclick="changeHaiku(-1)">＞</button> 
        <button id="nextBtn" class="nav-arrow arrow-left" onclick="changeHaiku(1)">＜</button>  
        <div class="haiku-screen"><p id="haikuPhrase" class="phrase"></p></div>
    </div>

    <!-- ⚙️ プログラムファイルを読み込み -->
    <script src="app.js"></script>
</body>
</html>
